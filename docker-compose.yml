services:
  # Vector Database for Phase 1
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: qdrant
    ports:
      - "6333:6333" # REST API & Dashboard
      - "6334:6334" # gRPC
    expose:
      - "6333"
      - "6334"
      - "6335" # For internal communication (optional)
    volumes:
      - ./qdrant_data:/qdrant/storage
    

  # Graph Database for Phase 2 & 3
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP Browser/Dashboard
      - "7687:7687" # Bolt protocol (for your Python driver)
    environment:
      - NEO4J_AUTH=neo4j/testpass123 # You'll need this for the Python client
      - NEO4J_PLUGINS=["apoc"] 
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_plugins:/plugins

  # Isolated graph store for the MetaQA track: Phase 2 MetaQA ingest must never
  # touch the HotpotQA graph. Use this when your Neo4j server does not support
  # multiple databases, and point the config at it:
  #   NEO4J_METAQA_URI=neo4j://127.0.0.1:7688
  #   NEO4J_METAQA_DATABASE=neo4j
  neo4j-metaqa:
    image: neo4j:5
    restart: unless-stopped
    container_name: neo4j-metaqa
    ports:
      - "7475:7474" # HTTP Browser/Dashboard
      - "7688:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/testpass123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j_metaqa_data:/data
      - ./neo4j_metaqa_logs:/logs
      - ./neo4j_metaqa_plugins:/plugins

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins: